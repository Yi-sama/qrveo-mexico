server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 与旧官网（vod-private/mexico-official）相同的约定：
    # 启动脚本把控制台 / API / 观看页地址写进 /mexico/private-runtime.js，这里把它插进每个页面
    sub_filter '</head>' '<script src="/mexico/private-runtime.js"></script></head>';
    sub_filter_once on;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json;

    location = / { return 302 /mexico/; }
    location = /mexico { return 301 /mexico/; }

    location = /mexico/private-runtime.js {
        add_header Cache-Control "no-store";
    }
    # 带 ?v= 版本号的样式和脚本可以长期缓存
    location /mexico/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /mexico/ {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # 网站编辑入口（可选）：只在部署了 official-editor 容器时打开下面三行
    # location /editar {
    #     proxy_pass http://official-editor:4322;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
